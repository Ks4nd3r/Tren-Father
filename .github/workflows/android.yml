name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      PYTHONFORANDROID_PREREQUISITES_INSTALL_INTERACTIVE: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Check data storage
        run: python -m unittest discover -s tests
      - name: Restore Android SDK and NDK cache
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: buildozer-global-${{ runner.os }}-api35-v1
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip build-essential libffi-dev libssl-dev autoconf automake libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake
          python -m pip install --upgrade pip
          python -m pip install buildozer setuptools cython==0.29.34
      - name: Build debug APK
        run: |
          set -o pipefail
          if buildozer android debug 2>&1 | tee buildozer.log; then
            echo "APK built successfully" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### Buildozer error (last 120 lines)"
              echo '```text'
              tail -n 120 buildozer.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: buildozer-log
          path: buildozer.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: workout-diary-apk
          path: bin/*.apk
